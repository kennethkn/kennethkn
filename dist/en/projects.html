:{\"heading\":\"Photos 📸\",\"back\":\"Back\",\"aboutHeading\":\"About Photos\",\"aboutText\":\"A glimpse of Hong Kong: where East meets West and old meets new.\"}},\"about\":{\"heading\":\"Hi! I’m Kenneth 👋\",\"readMore\":\"More\",\"readLess\":\"Less\",\"closingQuote\":\"Life is short—do what matters, appreciate the journey and the people in it, and have fun along the way.\",\"bio\":[\"I’m a software engineer based in Hong Kong. Growing up, I always had a knack for figuring out how things work. Playing a video game by following the intended path was never that interesting to me; instead, I loved messing with the mechanics, searching for exploits and shortcuts. The satisfaction of putting together something that breaks the system—something not even the developer had thought of—is what first sparked my passion for problem-solving.\",\"That curiosity naturally translated into a career in computer science, where I get to build creative solutions to complex problems, much like I did in those video games. I chose to apply this passion in the field of finance because when technology meets finance, it becomes infrastructure that empowers millions of people around the world. Knowing that the code I write can make a tangible improvement in people’s lives is incredibly exciting to me, and it’s what drives me to keep learning and growing as a software engineer.\"],\"bioMore\":[\"When I’m not coding, you’ll most likely find me backpacking or hiking in the great outdoors, exploring new places and cultures, or simply testing out a new hobby that recently caught my interest. Spontaneity is my brand. I love trying new things and stepping out of my comfort zone, because I’d rather have bad experiences than no experiences at all. So if you ever invite me to do something that sounds remotely interesting, chances are I’ll say yes.\",\"Finally, a few fun facts about me: Estoy aprendiendo español, my favorite breed of dog is the Golden Retriever, and my music taste is energetic—techno, UKG, reggaeton—much like my personality. If you want to find out for yourself, are looking for a hiking buddy, or both, feel free to reach out via the contact links at the top. I love meeting new people, so don’t hesitate to say hi :)\"]},\"settings\":{\"light\":\"Light\",\"dark\":\"Dark\",\"settings\":\"Settings\",\"translationDisclaimer\":\"The original language of this website.\"},\"footer\":{\"copyright\":\"Kenneth Kwan © 2026\",\"builtWith\":\"Built with \u003cb\u003eNext.js\u003c/b\u003e\"}},\"now\":\"$undefined\",\"timeZone\":\"Asia/Shanghai\",\"children\":[\"$L16\",\"$L17\"]}]\n"])</script><script>self.__next_f.push([1,"16:[\"$\",\"main\",null,{\"children\":[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"footer\",null,{\"className\":\"inset-x-0 m-auto mb-12 mt-24 flex max-w-[85%] justify-center sm:max-w-xl\",\"children\":[\"$\",\"div\",null,{\"className\":\"w-full justify-between text-xs text-muted-foreground sm:flex\",\"children\":[\"Kenneth Kwan © 2026\",[\"$\",\"div\",null,{\"children\":[\"Built with \",[\"$\",\"span\",\"b0\",{\"className\":\"font-medium\",\"children\":[\"Next.js\"]}]]}]]}]}]\n"])</script><script>self.__next_f.push([1,"d:null\n12:[[\"$\",\"title\",\"0\",{\"children\":\"Kenneth Kwan\"}]]\n"])</script></body></html>

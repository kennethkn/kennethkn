\",\"Excel\",\"PowerPoint\",\"Access\",\"Google Workspace\",\"Lark Suite\"]},\"spokenLanguageItems\":[\"Inglés\",\"Cantonés\",\"Mandarín\",\"Español (un poco)\"]}},\"photos\":{\"section\":{\"heading\":\"— Hong Kong 🇭🇰 —\",\"viewMore\":\"Ver más\"},\"page\":{\"heading\":\"Fotos 📸\",\"back\":\"Volver\",\"aboutHeading\":\"Sobre las fotos\",\"aboutText\":\"Una mirada a Hong Kong: donde Oriente se encuentra con Occidente, y lo antiguo con lo moderno.\"}},\"about\":{\"heading\":\"¡Hola! Soy Kenneth 👋\",\"readMore\":\"Más\",\"readLess\":\"Menos\",\"closingQuote\":\"La vida es corta: haz lo que importa, valora el camino y a las personas que lo recorren contigo, y disfruta del proceso.\",\"bio\":[\"Soy un ingeniero de software de Hong Kong. Desde pequeño siempre tuve una facilidad especial para entender cómo funcionan las cosas. Jugar a un videojuego siguiendo el guión previsto nunca me pareció muy interesante; en cambio, me fascinaba explorar sus mecanismos, buscar exploits y encontrar atajos. La satisfacción de construir algo que rompe con el sistema —algo que ni siquiera el propio desarrollador había imaginado— fue lo que avivó mi pasión por resolver problemas.\",\"Esa curiosidad se transformó de forma natural en una carrera en informática, donde puedo encontrar soluciones creativas a problemas complejos, del mismo modo que lo hacía con aquellos videojuegos. Elegí aplicar esta pasión al mundo de las finanzas porque, cuando la tecnología se cruza con las finanzas, se convierte en infraestructura capaz de empoderar a millones de personas en todo el mundo. Saber que el código que escribo puede mejorar de forma tangible la vida de otros es increíblemente motivador, y es lo que me impulsa a seguir aprendiendo y creciendo como ingeniero de software.\"],\"bioMore\":[\"Cuando no estoy programando, lo más probable es que me encuentres viajando con mochila, haciendo senderismo en la naturaleza, explorando nuevos lugares y culturas, o simplemente probando algún hobby nuevo que haya captado recientemente mi atención. La espontaneidad es parte de mí. Me encanta probar cosas nuevas y salir de mi zona de confort, porque prefiero una mala experiencia a no tener ninguna. Así que, si alguna vez me propones hacer algo que suene mínimamente interesante, lo más probable es que diga que sí.\",\"Por último, algunos datos curiosos sobre mí: estoy aprendiendo español, mi raza de perro favorita es el Golden Retriever y mi gusto musical es bastante enérgico —techno, UKG, reguetón—, muy acorde con mi personalidad. Si quieres comprobarlo por ti mismo, buscas un compañero de senderismo o ambas cosas, no dudes en contactarme a través de los enlaces de arriba. Me encanta conocer gente nueva, así que ¡anímate a saludar! :)\"]},\"settings\":{\"light\":\"Claro\",\"dark\":\"Oscuro\",\"settings\":\"Ajustes\",\"translationDisclaimer\":\"Esta traducción fue revisada por un hablante nativo de español - mi novia :) Muchas gracias por tu ayuda, amor ❤️\"},\"footer\":{\"copyright\":\"Kenneth Kwan © 2026\",\"builtWith\":\"Hecho con \u003cb\u003eNext.js\u003c/b\u003e\"}},\"now\":\"$undefined\",\"timeZone\":\"Asia/Shanghai\",\"children\":[\"$L16\",\"$L17\"]}]\n"])</script><script>self.__next_f.push([1,"16:[\"$\",\"main\",null,{\"children\":[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]}]\n10:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"footer\",null,{\"className\":\"inset-x-0 m-auto mb-12 mt-24 flex max-w-[85%] justify-center sm:max-w-xl\",\"children\":[\"$\",\"div\",null,{\"className\":\"w-full justify-between text-xs text-muted-for
